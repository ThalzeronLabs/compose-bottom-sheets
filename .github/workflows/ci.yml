name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its Android runtime jar (~200 MB) on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests + screenshot verification
        run: ./gradlew :sheets:verifyRoborazziDebug

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: sheets/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Build the AAR
        run: ./gradlew :sheets:assembleRelease

      - name: Publish to Maven Local (same task JitPack runs)
        run: ./gradlew :sheets:publishReleasePublicationToMavenLocal

      - name: API docs (Dokka)
        run: ./gradlew :sheets:dokkaGenerate
